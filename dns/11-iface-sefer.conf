# Per-host listen interfaces: SEFER.
# CAREFUL: sefer's bridges are the opposite way round from seykhl's.
#   vmbr1 = VLAN 20      192.168.20.10/24   <- the fleet-facing resolver
#   vmbr0 = TRUSTED LAN  192.168.0.100/24   <- direct 10 GbE side
# Both are listed on purpose: VLAN 20 clients use 192.168.20.10 as their
# secondary resolver, and listening on the trusted side additionally gives
# that segment a local resolver that knows the internal zone (the router
# cannot answer internal.yesod.work at all).
interface=vmbr1
interface=vmbr0
interface=lo
