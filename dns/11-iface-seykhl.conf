# Per-host listen interfaces: SEYKHL.
# Seykhl is single-NIC and its vmbr0 IS VLAN 20 (192.168.20.202/24).
interface=vmbr0
interface=lo

# Seykhl is the authority for internal.yesod.work: it owns the curated
# infra.hosts AND (phase 2) the DHCP-registered guest names. 'local=' means
# answer-or-NXDOMAIN, never forward -- so seykhl must NOT forward this zone
# back to sefer. (Moved here from 10-yesod-lan-common.conf, which is deployed
# to both hosts; sefer forwards the zone to us instead.)
local=/internal.yesod.work/
