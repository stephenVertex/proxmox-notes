# Yesod fleet LAN name server -- settings shared by BOTH resolvers.
# network-guy, 2026-09-10. Canonical copy: proxmox-exper dns/, deployed by
# scripts/deploy-lan-dns.sh. Do not hand-edit on the hosts; edit here.
#
# Deployed identically to seykhl and sefer. The interface to listen on is NOT
# here -- it differs per host and lives in 11-yesod-lan-iface.conf, because
# seykhl's vmbr0 is VLAN 20 while sefer's vmbr0 is the TRUSTED LAN and its
# vmbr1 is VLAN 20. Those bridges are not interchangeable.
#
# DNS ONLY. No dhcp-range appears in this file, so neither resolver serves
# DHCP. Phase 2 gives DHCP to seykhl ALONE (dns/phase2-dhcp.conf.staged) and
# must never be deployed to both -- two DHCP servers on one L2 segment is
# worse than none.

# bind-dynamic (not bind-interfaces): tolerate the bridge gaining its address
# late at boot, and rebind if it changes. The interface= lines in the
# per-host file are what restrict us, so we never serve on tailscale0.
# No listen-address: hardcoding it made startup depend on the address already
# being configured, which is exactly what fails during a boot race.
bind-dynamic

# --- never read /etc/resolv.conf: tailscale owns that file on seykhl and
# points it at MagicDNS (100.100.100.100), which forwards back out -- we
# would forward our own queries in a loop.
no-resolv

# --- upstreams, deliberately NOT the gateway's unbound. On 2026-09-04 it
# produced three ~30 s resolution blips in 70 minutes that killed two runner
# claims and one push of a finished commit (ys-yes-ljwz). Going straight to
# public resolvers removes the gateway from that path for every LAN client.
server=1.1.1.1
server=9.9.9.9

# --- tailnet names keep resolving for every LAN client, via MagicDNS
server=/ts.net/100.100.100.100

# --- our authoritative local zones. 'local=' means answer or NXDOMAIN, never
# forward, so these names can never leak to a public resolver.
# NOT .local -- that is reserved for mDNS and would collide with the avahi
# resolution the gate demons already depend on.
local=/internal.yesod.work/
local=/lan.planetbarr.com/
local=/lan/
domain=internal.yesod.work
expand-hosts

# --- the curated inventory is the ONLY source of local names. /etc/hosts on
# seykhl says seykhl.lan and sefer's says sefer.meshcrawler.com; both are
# Proxmox install artifacts and neither should become fleet-wide truth.
no-hosts
addn-hosts=/etc/yesod/dns/infra.hosts

# --- hygiene: do not leak dotless names or private reverse lookups upstream
domain-needed
bogus-priv
cache-size=2000
log-facility=/var/log/dnsmasq.log
