# Public PyPI download cache. Adapted from the approach documented at
# https://github.com/hauntsaninja/nginx_pypi_cache
# Dedicated, unprivileged nginx instance; no uploads or arbitrary upstreams.
worker_processes 2;
pid /run/pypi-cache/nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 1k;
    client_body_temp_path /var/cache/pypi-cache/client;
    proxy_temp_path /var/cache/pypi-cache/temp;
    fastcgi_temp_path /var/cache/pypi-cache/fastcgi;
    uwsgi_temp_path /var/cache/pypi-cache/uwsgi;
    scgi_temp_path /var/cache/pypi-cache/scgi;

    log_format cache '$remote_addr "$request" status=$status bytes=$body_bytes_sent '
                     'cache=$upstream_cache_status request_time=$request_time '
                     'upstream_time=$upstream_response_time';
    access_log syslog:server=unix:/dev/log,tag=pypi_cache,severity=info cache;

    # LRU eviction; retain space for the Proxmox host. max_size is managed
    # asynchronously by nginx, so temporary downloads can exceed the target.
    proxy_cache_path /var/cache/pypi-cache/objects levels=1:2 keys_zone=pypi:16m
        max_size=10g min_free=20g inactive=30d use_temp_path=off;
    resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 192.168.20.202:3141;
        listen 127.0.0.1:3141;
        server_name pypi.internal.yesod.work;
        allow 127.0.0.1;
        allow 192.168.20.0/24;
        allow 192.168.0.0/24;
        deny all;

        location = /healthz {
            default_type text/plain;
            return 200 "pypi-cache ready\n";
        }
        location = / { return 302 http://pypi.internal.yesod.work:3141/simple/; }

        proxy_cache pypi;
        proxy_cache_key "$proxy_host$request_uri|$http_accept";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 120s;
        proxy_cache_lock_age 120s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        add_header X-PyPI-Cache $upstream_cache_status always;

        location /simple/ {
            limit_except GET HEAD { deny all; }
            set $index_origin pypi.org;
            proxy_pass https://$index_origin$request_uri;
            proxy_set_header Host pypi.org;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_ssl_name pypi.org;
            proxy_ignore_headers Cache-Control Expires;
            proxy_cache_valid 200 5m;
            proxy_cache_valid 301 302 5m;
            proxy_cache_valid 404 30s;
            # Keep hashes and all PEP 503/691 metadata; rewrite only the origin.
            # Both pip HTML and uv JSON clients must fetch wheels via this cache.
            sub_filter 'https://files.pythonhosted.org/packages/' 'http://pypi.internal.yesod.work:3141/packages/';
            sub_filter 'https://pypi.org/simple/' 'http://pypi.internal.yesod.work:3141/simple/';
            sub_filter_once off;
            sub_filter_types application/vnd.pypi.simple.v1+json application/vnd.pypi.simple.v1+html application/json;
            proxy_redirect https://pypi.org/simple/ http://pypi.internal.yesod.work:3141/simple/;
        }

        location /packages/ {
            limit_except GET HEAD { deny all; }
            proxy_cache_key "$proxy_host$request_uri";
            proxy_force_ranges on;
            set $file_origin files.pythonhosted.org;
            proxy_pass https://$file_origin$request_uri;
            proxy_set_header Host files.pythonhosted.org;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_ssl_name files.pythonhosted.org;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 30s;
        }

        location / { return 404; }
    }
}
