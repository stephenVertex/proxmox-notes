# sefer's LAN time configuration (network-guy, 2026-09-10, revised 23:5xZ).
# Canonical copy: proxmox-exper ntp/. Installed at
# /etc/chrony/conf.d/yesod-lan-server.conf
#
# ROLE SPLIT -- this host SERVES the fleet but FOLLOWS seykhl. Those are
# different jobs and only the second one is constrained by the gate contract.
#
# WHY NOT `peer`: this was briefly configured as a symmetric peer of seykhl so
# that neither host depended on the other. That broke the gate birth attestor
# (ops/gate/attest-host-time.py), which matches chrony's SERVER marker '^*'
# only; a symmetric peer renders as '=' and can never match. Worse, with the
# public pool still present chrony actually SELECTED a public internet server
# and left seykhl unselected -- so this host's clock, which gates every gate
# and testdb birth, was being steered by a stranger on the internet, and it
# flapped. Measured 2026-09-10:
#     ^* ntps2-01.bji01.0150n.net   <- selected, public, stratum 2
#     =+ seykhl.internal.yesod.work <- the reviewed source, NOT selected
#
# So: follow seykhl in client mode, and let it be the only source.
server 192.168.20.202 iburst prefer

# The public pool in /etc/chrony/chrony.conf is COMMENTED OUT on this host on
# purpose. `prefer` only biases selection -- chrony can still pick a pool
# source when the preferred one is briefly unreachable, which is precisely the
# flapping above. For the attestation guarantee to hold, the alternative has to
# be absent, not merely demoted.
#
# FAIL-CLOSED, and this is deliberate: if seykhl is unreachable this host has no
# upstream, so `chronyc sources` shows no '^*' and births correctly REFUSE
# rather than minting demons against an unreviewed clock. A public fallback
# that quietly takes over would defeat the point of attesting time at all.

# --- the SERVING half, unaffected by the above.
# This host keeps answering ntp2 for the fleet, and keeps serving last-known
# time (local stratum 10) if its own upstream is lost. Serving the fleet and
# being trusted to gate a birth are separate roles.
allow 192.168.20.0/24
allow 192.168.0.0/24
allow 100.64.0.0/10
local stratum 10
