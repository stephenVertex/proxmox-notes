# sefer as the fleet's SECOND NTP server (network-guy, 2026-09-10).
# Canonical copy: proxmox-exper ntp/. Installed at
# /etc/chrony/conf.d/yesod-lan-server.conf
#
# Until now seykhl was the fleet's only time source, with no fallback at all.
# A silent chrony death there does not look like an outage -- it surfaces much
# later as clock skew in gate evidence, which reads as a code fault.
allow 192.168.20.0/24
allow 192.168.0.0/24
allow 100.64.0.0/10

# Keep serving last-known time if upstream is lost, rather than going away.
local stratum 10

# Peer with seykhl so the two servers agree with each other instead of
# drifting independently. Symmetric: seykhl carries the matching peer line.
peer 192.168.20.202 iburst
