# seykhl as interim NTP server for the yesod fleet (network-guy, 2026-09-06).
# Canonical copy: proxmox-exper ntp/. Installed at
# /etc/chrony/conf.d/yesod-lan-server.conf
#
# Serves VLAN 20, the trusted LAN and the tailnet. Keeps serving last-known
# time for 10 stratum levels if upstream is lost (local stratum 10).
allow 192.168.20.0/24
allow 192.168.0.0/24
allow 100.64.0.0/10
local stratum 10

# Peer with sefer (added 2026-09-10) so the two servers agree with each other
# instead of drifting independently. Symmetric: sefer carries the match.
peer 192.168.20.10 iburst
