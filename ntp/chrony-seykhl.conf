# seykhl as the fleet's NTP ROOT (network-guy, 2026-09-06, revised 2026-09-10).
# Canonical copy: proxmox-exper ntp/. Installed at
# /etc/chrony/conf.d/yesod-lan-server.conf
#
# This is the reviewed source the gate birth attestor expects every birth host
# to be following. It takes its own time from the public pool configured in
# /etc/chrony/chrony.conf; sefer follows THIS host rather than the internet.
#
# The `peer 192.168.20.10` line that briefly lived here is REMOVED. Symmetric
# peering with sefer made neither host a definite root, rendered as '=' instead
# of '^*' in chronyc, and could not satisfy the attestor. Chain is now:
#     public pool -> seykhl (root) -> sefer (relay, serves ntp2) -> fleet
#
# Serves VLAN 20, the trusted LAN and the tailnet. Keeps serving last-known
# time for 10 stratum levels if upstream is lost (local stratum 10).
allow 192.168.20.0/24
allow 192.168.0.0/24
allow 100.64.0.0/10
local stratum 10
